<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&A Print Solutions - Acesso ao Sistema</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F7F7F8;--card:#FFFFFF;--border:#E2E2E4;
  --text:#262626;--text2:#3A3A3A;--text3:#6B6B6E;
  --accent:#C52E35;--accent-hover:#A82228;--brand-gray:#868789;
  --ok:#1F9D66;--danger:#C0392B;
  --sel-border:#D9D9DB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* Faixa superior com a cor da marca */
.top-strip{height:5px;background:linear-gradient(90deg,var(--accent) 0%,var(--brand-gray) 100%)}

.wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:40px;
  width:100%;
  max-width:420px;
  box-shadow:0 10px 40px rgba(0,0,0,.06);
}

.logo-area{text-align:center;margin-bottom:28px}
.logo-area img{height:56px;margin-bottom:18px}
.logo-area .produto{
  font-size:13px;color:var(--text3);
  border-top:1px solid var(--border);
  padding-top:14px;
  letter-spacing:.02em;
}
.logo-area .produto strong{color:var(--accent)}

.form-group{margin-bottom:16px}
.form-group label{
  display:block;font-size:12px;color:var(--text3);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;
}
.form-group input{
  width:100%;padding:12px 14px;
  border:1px solid var(--sel-border);border-radius:10px;
  font-size:14px;background:#fff;color:var(--text);
  transition:border-color .15s;
}
.form-group input:focus{outline:none;border-color:var(--accent)}

.btn-login{
  width:100%;padding:13px;
  background:var(--accent);color:#fff;border:none;
  border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  transition:background .15s;margin-top:6px;
}
.btn-login:hover{background:var(--accent-hover)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}

.msg{
  margin-top:16px;padding:11px 14px;border-radius:9px;
  font-size:13px;display:none;
}
.msg.erro{display:block;background:#FCEBEB;color:var(--danger);border:1px solid #F5C6C6}
.msg.ok{display:block;background:#E5F6ED;color:var(--ok);border:1px solid #BFE6CF}

.rodape{
  text-align:center;font-size:11px;color:var(--text3);
  padding:20px;line-height:1.6;
}
.rodape a{color:var(--accent);text-decoration:none}

.link-rastreio{
  text-align:center;margin-top:20px;padding-top:20px;
  border-top:1px solid var(--border);
}
.link-rastreio a{
  font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.link-rastreio a:hover{text-decoration:underline}
.link-rastreio .sub{font-size:11px;color:var(--text3);margin-top:4px}
</style>
</head>

      <div class="produto">Sistema de <strong>Rastreamento de Pedidos</strong></div>
    </div>

    <div class="form-group">
      <label for="email">Usuário ou e-mail</label>
      <input type="text" id="email" placeholder="seu usuário ou e-mail" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')entrar()">
    </div>

    <button class="btn-login" id="btn-entrar" onclick="entrar()">Entrar</button>

    <div class="msg" id="msg"></div>

    <div class="link-rastreio">
      <a href="rastreio.html"><i class="ti ti-package"></i> Rastrear meu pedido</a>
      <div class="sub">Para clientes: consulte o status sem precisar de login</div>
    </div>
  </div>
</div>

<div class="rodape">
  D&A Print Solutions &middot; Uso restrito.<br>
  Em caso de problema de acesso, procure o setor de PCP.
</div>

<script src="config.js"></script>
<script>
// Se ja estiver logado, pula direto para o painel.
(async function checarSessao(){
  try{
    var r=await supabaseClient.auth.getSession();
    if(r.data&&r.data.session){window.location.href='app.html';}
  }catch(e){/* segue mostrando o login */}
})();

function mostrarMsg(texto,tipo){
  var el=document.getElementById('msg');
  el.textContent=texto;
  el.className='msg '+tipo;
}

async function entrar(){
  var entrada=(document.getElementById('email').value||'').trim();
  var senha=document.getElementById('senha').value||'';
  var btn=document.getElementById('btn-entrar');

  if(!entrada||!senha){mostrarMsg('Preencha usuário/e-mail e senha.','erro');return;}

  // Operador digita so o usuario (sem @). Completamos o e-mail de fachada.
  var email = entrada.indexOf('@')>=0 ? entrada : (entrada.toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@operador.daprint.local');

  btn.disabled=true;btn.textContent='Entrando...';
  mostrarMsg('','');

  try{
    var r=await supabaseClient.auth.signInWithPassword({email:email,password:senha});
    if(r.error){
      mostrarMsg('Usuário ou senha incorretos.','erro');
      btn.disabled=false;btn.textContent='Entrar';
      return;
    }
    mostrarMsg('Acesso liberado! Redirecionando...','ok');
    window.location.href='app.html';
  }catch(e){
    mostrarMsg('Erro ao conectar. Tente novamente.','erro');
    btn.disabled=false;btn.textContent='Entrar';
  }
}
</script>
